apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shopping
spec:
  replicas: 3
  selector:
    matchLabels:
      app: online-shopping
  template:
    metadata:
      labels:
        app: online-shopping
    spec:
      containers:
      - name: online-shopping
        image: online-shopping:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: online-shopping
spec:
  type: NodePort
  selector:
    app: online-shopping
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
